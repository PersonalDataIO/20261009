ordre_dans_famille:
- T
- R
- Qc
- Qm
- C
- E
- M
- L
types:
- code: T
  nom: Terrain
  lettre: T
  niveau: 1
  tenue_par: chauffeurs
  description: Une situation vécue par un chauffeur, à la première personne.
  serrure: []
  translations:
    en:
      nom: Driver
      description: A situation experienced by a driver, in the first person.
- code: R
  nom: Recherche
  lettre: R
  niveau: 1
  tenue_par: mathematiciens
  description: Une situation vécue par un mathématicien, à la première personne.
  serrure: []
  translations:
    en:
      nom: Research
      description: A situation experienced by a mathematician, in the first person.
- code: Qc
  nom: Question
  code_affiche: cQm
  lettre: Q
  indice: c
  niveau: 1
  tenue_par: chauffeurs
  description: 'cQm : les chauffeurs posent une question aux mathématiciens. Se révèle avec l’Écho (E). Tenue par les chauffeurs : on ne peut faire avancer la famille qu’en demandant à l’autre groupe.'
  serrure:
  - E
  translations:
    en:
      nom: Question
      description: 'cQm: drivers ask a question of mathematicians. Reveals with the Echo (E). Held by drivers: the family can advance only by asking the other group.'
- code: Qm
  nom: Question
  code_affiche: mQc
  lettre: Q
  indice: m
  niveau: 1
  tenue_par: mathematiciens
  description: 'mQc : les mathématiciens posent une question aux chauffeurs. Se révèle avec l’Écho (E). Tenue par les mathématiciens.'
  serrure:
  - E
  translations:
    en:
      nom: Question
      description: 'mQc: mathematicians ask a question of drivers. Reveals with the Echo (E). Held by mathematicians.'
- code: C
  nom: Contrainte
  lettre: C
  niveau: 1
  tenue_par: mixte
  description: 'Un fait, une règle ou un argument adverse qui bloque le Levier. Se révèle avec le Motif (M) ; la table la trie : malentendu, désaccord ou conflit.'
  serrure:
  - M
  translations:
    en:
      nom: Constraint
      description: A fact, rule, or opposing argument that blocks the Lever. Reveals with the Motif (M); the group sorts it as misunderstanding, disagreement, or conflict.
- code: E
  nom: Écho
  lettre: E
  niveau: 2
  tenue_par: mixte
  description: Le moment où les deux vécus riment.
  serrure:
  - T
  - R
  translations:
    en:
      nom: Echo
      description: The moment when the two lived experiences rhyme.
- code: M
  nom: Motif
  lettre: M
  niveau: 2
  tenue_par: mixte
  description: Le motif commun, nommé une fois les deux questions posées.
  serrure:
  - Qc
  - Qm
  translations:
    en:
      nom: Motif
      description: The shared motif, named after both Questions are asked.
- code: L
  nom: Levier
  lettre: L
  niveau: 3
  tenue_par: mixte
  description: Une action commune, révélée avec la Contrainte (C), puis jouée après son tri.
  serrure:
  - C
  translations:
    en:
      nom: Lever
      description: A joint action, revealed with the Constraint (C), then played after it has been sorted.
- code: P
  nom: Pont
  lettre: P
  niveau: 2
  tenue_par: mixte
  description: Relie deux familles. Une moitié écrite par un chauffeur, l’autre par un mathématicien.
  translations:
    en:
      nom: Bridge
      description: Connects two families. One half is written by a driver, the other by a mathematician.
- code: J
  nom: Enjeu
  lettre: J
  niveau: 1
  tenue_par: null
  description: Ce dont chaque groupe a besoin de l’alliance. Rempli en secret au début, retourné à la fin.
  translations:
    en:
      nom: Stake
      description: What each group needs from the alliance. Filled in secretly at the start and turned over at the end.
