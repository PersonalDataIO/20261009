  legend_intro: "{cards} cartes. Chaque famille thématique compte {families} cartes qui s’activent les unes les autres, des vécus de chaque groupe jusqu’à un Levier d’action commune. Chaque carte porte une lettre (son type) et un numéro (sa famille) : 4M est le Motif de la famille 4."
