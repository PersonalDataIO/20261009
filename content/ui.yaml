  card_types: Card types
  families: Families
  printing: Printing
  transition_title: Game transitions
  transition_intro: Within each family, cards are revealed through conversation. Bridges connect families and help determine victory.
  phase_recognize: Recognize
  phase_explore: Explore and name
  phase_act: Act together
  phase_summary: Debrief
  lived_experiences: Both lived experiences are on the table; together they reveal the Echo.
  questions_reveal: Questions reveal with the Echo. The Motif reveals when both Questions are on the table; the group names it.
  constraint_lever: The Motif reveals the Constraint; the Constraint reveals the Lever. Sort the Constraint before playing the Lever.
  lever_touches_family: A Lever counts only if a Bridge touches its family.
  bridge: Bridge
  false_bridge: False bridge
  bridge_unlock: Reveals when both linked Motifs are on the table.
  false_bridge_rule: A Constraint placed on a Bridge and sorted as a conflict marks it as false; it stays on the table.
  victory: Cooperative victory
  victory_check: Check that the Levers serve both groups, turn over both Stakes, and photograph the Bridge network.
